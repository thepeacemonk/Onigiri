<!DOCTYPE html>
<html class="osw-booting">
<head>
<meta charset="utf-8">
<style>
  /* First-paint guard. Kept in the template rather than the large bundled
     stylesheet so Chromium sees it before parsing any of the settings assets. */
  html, body { background: /*__ONIGIRI_BOOT_BACKGROUND__*/; }
  html.osw-booting .osw-shell,
  html.osw-booting .osw-toast { visibility: hidden !important; }
</style>
<style>
  /*__ONIGIRI_FONT_FACE__*/
  /* The Main Menu's real widget rules, lifted from web/menu.css so previews
     render with them rather than with a lookalike. Its class names (.stat-card,
     .star-rating, …) are disjoint from the dialog's own .osw-* namespace. */
  /*__ONIGIRI_REAL_WIDGET_CSS__*/
  /*__ONIGIRI_SETTINGS_CSS__*/
</style>
</head>
<body>
  <div class="osw-shell" id="oswShell">
    <aside class="osw-panel osw-rail" id="oswRail">
      <div class="osw-rail-top">
        <button class="osw-icon-btn osw-rail-toggle" id="oswRailToggle" type="button"></button>
        <label class="osw-search" id="oswSearchWrap">
          <span class="osw-search-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          </span>
          <input id="oswSearch" type="search" autocomplete="off" spellcheck="false">
        </label>
      </div>
      <!-- Presentation mode is remembered separately from individual settings. -->
      <div class="osw-complexity" id="oswComplexity" role="group">
        <button type="button" data-complexity="simple"></button>
        <button type="button" data-complexity="advanced"></button>
      </div>
      <nav class="osw-nav" id="oswNav"></nav>
      <div class="osw-rail-bottom">
        <button class="osw-rail-action" id="oswDonate" type="button">
          <span class="osw-rail-action-icon" aria-hidden="true"></span>
          <span class="osw-rail-action-label"></span>
        </button>
        <button class="osw-rail-action" id="oswBugs" type="button">
          <span class="osw-rail-action-icon" aria-hidden="true"></span>
          <span class="osw-rail-action-label"></span>
        </button>
        <div class="osw-rail-commit">
          <div class="osw-autosave" id="oswAutosave" data-state="idle">
            <span class="osw-autosave-dot" aria-hidden="true"></span>
            <span class="osw-autosave-label"></span>
          </div>
          <button class="osw-btn osw-btn-primary" id="oswDone" type="button">
            <span class="osw-btn-label"></span>
            <span class="osw-btn-action-icon" aria-hidden="true">
              <span class="osw-btn-icon"></span>
            </span>
          </button>
        </div>
      </div>
    </aside>

    <main class="osw-panel osw-main">
      <header class="osw-page-head">
        <div class="osw-page-head-row">
          <h1 id="oswPageTitle"></h1>
          <!-- Sub-menu tabs of a tabbed page sit on the title's line; the strip
               falls back to icon-only when the labels stop fitting. -->
          <div class="osw-subtabs" id="oswPageTabs"></div>
        </div>
        <p id="oswPageDesc" class="osw-page-desc"></p>
      </header>
      <div class="osw-page-scroll" id="oswPageScroll">
        <div class="osw-page" id="oswPage"></div>
      </div>
    </main>
  </div>

  <div class="osw-toast" id="oswToast" role="status" aria-live="polite"></div>

<script>
  const ONIGIRI_SETTINGS_CONTEXT = /*__ONIGIRI_SETTINGS_CONTEXT__*/null;
  /* Settings supplies its own illustrative data. The renderer itself is the
     production menu renderer; only its menu auto-boot is disabled here. */
  window.onigiriHeatmapDisableAutoRender = true;
  /*__ONIGIRI_HEATMAP_JS__*/
  /* The settings previews call the same element factory as live reviewer
     notifications, so notification markup cannot drift into a lookalike. */
  /*__ONIGIRI_NOTIFICATIONS_JS__*/
  /*__ONIGIRI_SETTINGS_JS__*/
</script>
</body>
</html>
