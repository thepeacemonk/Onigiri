<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /*__HASHI_FONT_FACE__*/
  :root {
    --bg: #f4f4f1; --shell: #fbfbf9; --surface: #fff; --surface-2: #efefeb;

  /* Animatable length that drives the bottom-left page-fold on hover. */

  * { box-sizing: border-box; }
  html body button, html body input { font: inherit; }
  /* Anki's webview.css ships `button:hover { background: <gradient>; border: 1px

     repaints our buttons on hover. Neutralise it once, here. */
  html body button { appearance: none !important; -webkit-appearance: none !important; box-shadow: none !important; background-image: none !important; border: 0 !important; }
  html body button:hover, html body button:focus, html body button:active { border: 0 !important; }

  svg { display: block; }
  .window-shell { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); opacity: 0; transition: opacity .15s ease; }

  .page-title { display: flex; align-items: baseline; gap: 8px; min-width: max-content; padding-right: 4px; }
  h1 { margin: 0; font-size: 18px; line-height: 1.1; letter-spacing: -.03em; font-weight: 760; }
  /* View switch, sort and New note live in one continuous bar. Hover only

  .toolset { order: 3; display: flex; align-items: center; height: 36px; padding: 3px; border: 0; border-radius: 12px; background: var(--surface); }
  .toolset-sep { width: 1px; height: 16px; flex: 0 0 1px; margin: 0 6px; background: color-mix(in srgb, var(--fg3) 28%, transparent); }
  /* Every control in the bar: same box, same type, same idle/hover paint. */
  html body .toolset button, html body .toolset button:hover, html body .toolset button:active {

    background-color: transparent; cursor: pointer;
    font-size: 10.5px; font-weight: 650; line-height: 1; white-space: nowrap;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    transform: none; transition: color .3s ease;
  }
  html body .toolset .new-button, html body .toolset .new-button:hover, html body .toolset .new-button:active { background-color: var(--accent); color: #fff; }

     switching views reads as one continuous move rather than two repaints. */
  .seg { position: relative; display: flex; gap: 2px; padding: 0; border: 0; border-radius: 0; background: transparent; }
  .seg-thumb { position: absolute; top: 0; left: 0; z-index: 0; width: 0; height: 30px; border-radius: 9px; background: var(--accent); pointer-events: none; transition: transform .34s cubic-bezier(.32,1.3,.5,1), width .34s cubic-bezier(.32,1.3,.5,1); }
  .seg:not(.is-ready) .seg-thumb { transition: none; }
  .seg button { position: relative; z-index: 1; color: var(--fg3); }
  .seg button:hover { color: var(--fg2); }
  html body .toolset .seg button.on, html body .toolset .seg button.on:hover, html body .toolset .seg button.on:active { color: #fff; }
  .new-button svg { width: 15px; height: 15px; }
  .sortwrap { position: relative; }
  .sortbtn { color: var(--fg3); }
  .sortbtn:hover { color: var(--fg2); }
  .sortbtn svg { width: 13px; height: 13px; }
  .searchbox { order: 2; height: 36px; min-width: 140px; flex: 1 1 260px; display: flex; align-items: center; gap: 8px; padding: 0 11px; border: 0; border-radius: 11px; color: var(--fg3); background: var(--surface); transition: color .3s ease; }
  .searchbox:focus-within { box-shadow: none; color: var(--fg2); }
  .searchbox svg { width: 15px; height: 15px; flex: 0 0 auto; }
  #search { width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--fg); font-size: 11.5px; }
  #search::placeholder { color: var(--fg3); }
  /* Centred on the button it hangs from, so the popover and its origin share

  .sortpop button:hover { color: var(--fg); }

  .hashi-sysmask { display: inline-block; background-color: currentColor; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: center; mask-position: center; -webkit-mask-size: contain; mask-size: contain; }
  .card-title-wrap { min-width: 0; flex: 1 1 auto; }
  .card-title { overflow: hidden; color: var(--card-fg); font-size: 15px; font-weight: 750; line-height: 1.25; text-overflow: ellipsis; white-space: nowrap; }
  .card-age { margin-top: 3px; color: var(--card-fg3); font-size: 9.5px; }
  .card-title-wrap > .card-age:only-child { margin-top: 0; }
  .priority-dot { width: 7px; height: 7px; flex: 0 0 7px; border-radius: 50%; background: var(--priority, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--priority) 11%, transparent); }
  .card-body { flex: 1 1 auto; overflow: hidden; margin: 18px 1px 14px; color: var(--card-fg2); font-size: 11.5px; line-height: 1.55; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; }
  .card-body.empty { color: var(--card-fg3); font-style: italic; }
  .card-footer:empty { display: none; }
  .card-footer { min-height: 23px; display: flex; align-items: center; gap: 7px; color: var(--card-fg3); font-size: 9.5px; }
  .keep-chip { padding: 4px 7px; border-radius: 8px; background: var(--card-soft); color: var(--card-fg2); font-weight: 650; white-space: nowrap; }
  .tags { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .actions { position: absolute; right: 11px; bottom: 10px; display: flex; gap: 5px; opacity: 0; transform: translateY(3px); transition: opacity .13s, transform .13s; }
  .card:hover .actions, .card:focus-within .actions { opacity: 1; transform: none; }
  .actions button { width: 30px; height: 30px; padding: 0; border: 0; border-radius: 10px; background: var(--card-soft); color: var(--card-fg2); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .actions svg { width: 14px; height: 14px; }
  .newcard { --card-fill: var(--surface-2); min-height: 214px; border: 0; align-items: center; justify-content: center; text-align: center; filter: none; }
  .newcard:hover { filter: drop-shadow(0 0 6px rgba(24,28,25,.07)) drop-shadow(0 4px 10px rgba(24,28,25,.05)); }
  .new-plus { width: 42px; height: 42px; margin-bottom: 12px; border-radius: 14px; background: var(--surface); color: var(--accent); display: flex; align-items: center; justify-content: center; }
  .new-plus svg { width: 19px; height: 19px; } .new-title { font-size: 12px; font-weight: 700; } .new-sub { margin-top: 4px; color: var(--fg3); font-size: 9.5px; }

  .empty-orbit { width: 62px; height: 62px; margin-bottom: 15px; border: 0; border-radius: 20px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; color: var(--accent); transform: rotate(-4deg); }

  .group-mini { flex: 1 1 auto; overflow: hidden; margin: 16px 1px 12px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 7px; }
  .group-tile { min-height: 0; overflow: hidden; padding: 5px; border-radius: 10px; background: var(--card-soft); color: var(--card-fg2); display: flex; align-items: center; justify-content: center; font-size: 9.5px; line-height: 1.3; text-align: center; }
  .group-tile img, .group-tile .hashi-sysmask { width: 17px; height: 17px; object-fit: contain; }
  .group-tile.more { font-weight: 750; font-size: 11px; }
  .group-title.editing { outline: none; border-radius: 6px; background: color-mix(in srgb, var(--card-fg) 9%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--card-fg) 9%, transparent); white-space: nowrap; }

  .grouphead, .selbar { display: flex; align-items: center; gap: 8px; margin: 2px 0 14px; padding: 6px 7px 6px 12px; border-radius: 13px; background: var(--surface); }

  .grouphead-title:focus { outline: none; background: var(--surface-2); }
  .grouphead-count { flex: 1 1 auto; color: var(--fg3); font-size: 10px; }

  html body .barbtn, html body .barbtn:hover, html body .barbtn:active { height: 29px; margin: 0; padding: 0 11px; border: 0; border-radius: 9px; background-color: transparent; color: var(--fg3); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 650; white-space: nowrap; transition: color .3s ease; }
  .barbtn:hover { color: var(--fg); }

  html body .barbtn.primary, html body .barbtn.primary:hover, html body .barbtn.primary:active { background-color: var(--accent); color: #fff; }
  .barbtn.danger:hover { color: #e05353; }
  @media (max-width: 680px) { .canvas { padding: 16px 18px 34px; } .pagebar { top: -16px; flex-wrap: wrap; } .page-title { order: 1; } .searchbox { flex-basis: 100%; } .toolset { order: 4; } #grid { grid-template-columns: 1fr; } }
</style>

    </header>
    <div class="grouphead" id="grouphead" hidden></div>
    <div class="selbar" id="selbar" hidden></div>
    <section id="grid"></section>
  </main>
</div>

  const DARK_NOTE_COLORS={"#ffd2d2":"#704146","#ffdfbf":"#704d38","#fff0a8":"#67582d","#c9efcf":"#345e48","#c7e8f7":"#315569","#d4dcff":"#414979","#e6d0f5":"#59436b","#f5d0e0":"#6b4156","#d8dcd9":"#4b504c"};function normalizeHex(value){let h=String(value||"").trim().replace("#","");if(h.length===3)h=h.split("").map((c)=>c+c).join("");return/^[0-9a-f]{6}$/i.test(h)?"#"+h.toLowerCase():"";}function hexToRgb(hex){const h=normalizeHex(hex).slice(1);return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}function rgbToHex(rgb){return"#"+rgb.map((n)=>Math.max(0,Math.min(255,Math.round(n))).toString(16).padStart(2,"0")).join("");}function mixHex(a,b,amount){const x=hexToRgb(a),y=hexToRgb(b);return rgbToHex(x.map((n,i)=>n+(y[i]-n)*amount));}function paperForTheme(value){const source=normalizeHex(value);return!source||!isDark?source:(DARK_NOTE_COLORS[source]||mixHex(source,"#23211f",.52));}const INK_DARK="#241f1b",INK_LIGHT="#fffdf7";function relLuminance(color){const rgb=hexToRgb(color).map((n)=>{const v=n/255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4);});return .2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2];}function contrastRatio(a,b){const la=relLuminance(a),lb=relLuminance(b);return (Math.max(la,lb)+.05)/(Math.min(la,lb)+.05);}function textOnPaper(color){const cd=contrastRatio(INK_DARK,color),cl=contrastRatio(INK_LIGHT,color),dark=cd>=cl,ink=dark?INK_DARK:INK_LIGHT,best=dark?cd:cl;if(best>=4.5)return ink;const extreme=dark?"#000000":"#ffffff";return contrastRatio(extreme,color)>best?extreme:ink;}function mutedInk(fg,paper,amount,minRatio){for(let step=amount;step>0;step-=.06){const candidate=mixHex(fg,paper,step);if(contrastRatio(candidate,paper)>=minRatio)return candidate;}return fg;}
  function iconHtml(value){if(!value)return"";const base=ctx.addonBase||"";if(value.indexOf("emoji:")===0){const emoji=value.slice(6),asset=(ctx.emojiSprites||{})[emoji];return asset?'<img src="'+base+'system_files/emojis/'+safe(asset)+'">':safe(emoji);}if(value.indexOf("system:")===0){const src=base+"system_files/system_icons/available_for_users/"+value.slice(7);return'<span class="hashi-sysmask" style="-webkit-mask-image:url(&quot;'+safe(src)+'&quot;);mask-image:url(&quot;'+safe(src)+'&quot;)"></span>';}return'<img src="'+base+'user_files/custom_deck_icons/'+safe(value)+'">';}
  function relativeDate(iso){const date=new Date(iso);if(isNaN(date))return"";const days=Math.floor((Date.now()-date.getTime())/86400000);if(days<1)return tS("hashi_today","today");if(days<2)return tS("hashi_yesterday","yesterday");const pattern=tS("hashi_days_ago","{}d ago");return pattern.replace("{}",days);}
  function keepLabel(note){if(!note.retention)return"";const expiry=new Date(note.created_at).getTime()+Number(note.retention)*86400000;const left=Math.max(0,Math.ceil((expiry-Date.now())/86400000));return left+tS("hashi_days_left_suffix","d left");}
  function priorityColor(value){return{high:"#ef5f5f",med:"#e2a83e",low:"#49a7d8"}[value]||"transparent";}
  // ── Item model ─────────────────────────────────────────────────────────────
  // The grid renders "items", not notes: an item is either a note or a group
  // (a folder card). Groups only exist for the gallery — a note's membership
  // is its own `group` field, so the rest of the add-on never sees them.
  const keyOf=(item)=>item.kind==="group"?"g:"+item.group.id:"n:"+item.note.id;
  function groupById(id){return groups.find((group)=>group.id===id)||null;}
  function byManual(a,b){return((a.order|0)-(b.order|0))||(new Date(b.created_at)-new Date(a.created_at));}
  function notesInGroup(id){return active.filter((note)=>note.group===id).sort(byManual);}
  function itemForKey(key){const id=key.slice(2);if(key.charAt(0)==="g"){const group=groupById(id);return group?{kind:"group",group:group}:null;}const note=active.find((n)=>n.id===id)||trashed.find((n)=>n.id===id);return note?{kind:"note",note:note}:null;}
  function noteItems(list){return list.map((note)=>({kind:"note",note:note}));}

  function matches(note){if(!query)return true;const haystack=[note.title,stripHtml(note.body_md),(note.tags||[]).join(" ")].join(" ").toLowerCase();return haystack.includes(query);}
  function currentItems(){if(view==="trash")return noteItems(trashed.filter(matches));if(query)return noteItems(active.filter(matches));if(openGroup)return noteItems(notesInGroup(openGroup));return topLevelItems();}

  // Sort keys other than "manual" also have to rank group cards, so every key
  // reads through a per-item accessor that folds a group down to its members.
  const PRIORITY_RANK={high:0,med:1,low:2,none:3};
  function itemMembers(item){return item.kind==="group"?notesInGroup(item.group.id):[item.note];}
  function itemOrder(item){return item.kind==="group"?(item.group.order|0):(item.note.order|0);}
  function itemTitle(item){return item.kind==="group"?(item.group.title||""):(item.note.title||"");}
  function itemTime(item){return itemMembers(item).reduce((best,note)=>Math.max(best,new Date(note.updated_at||note.created_at).getTime()||0),0);}
  function itemTag(item){return itemMembers(item).reduce((best,note)=>{const tag=(note.tags||[])[0]||"~";return tag<best?tag:best;},"~");}

  function sorted(list){const items=list.slice();
    if(sortKey==="manual")items.sort((a,b)=>(itemOrder(a)-itemOrder(b))||(itemTime(b)-itemTime(a)));

    else if(sortKey==="title")items.sort((a,b)=>itemTitle(a).localeCompare(itemTitle(b)));
    else if(sortKey==="tags")items.sort((a,b)=>itemTag(a).localeCompare(itemTag(b)));

  // ── Persistence ────────────────────────────────────────────────────────────
  // One command carries the whole arrangement. The page has already painted the
  // new layout, so Python only writes it — nothing comes back.
  function persistLayout(){const payload={groups:groups.map((group)=>({id:group.id,title:group.title,order:group.order|0})),notes:{}};
    active.concat(trashed).forEach((note)=>{payload.notes[note.id]={group:note.group||"",order:note.order|0};});
    pycmd("hashi:layout:"+JSON.stringify(payload));}
  // Reordering only means something under manual sort, so the first drag under
  // any other sort freezes what is on screen and switches over.
  function ensureManual(){if(sortKey==="manual")return;
    sorted(topLevelItems()).forEach((item,index)=>{if(item.kind==="group")item.group.order=index;else item.note.order=index;});
    groups.forEach((group)=>{sorted(noteItems(notesInGroup(group.id))).forEach((item,index)=>{item.note.order=index;});});
    sortKey="manual";refreshSort();pycmd("hashi:set_sort:manual");}

  function openNote(command){$("shell").classList.add("hashi-out");setTimeout(()=>pycmd(command),150);}
  function selectionNoteIds(){const ids=[];selection.forEach((key)=>{const item=itemForKey(key);if(!item)return;if(item.kind==="note")ids.push(item.note.id);else notesInGroup(item.group.id).forEach((note)=>ids.push(note.id));});return ids;}

  // ── Cards ──────────────────────────────────────────────────────────────────
  const SEL_BADGE='<span class="sel-badge">'+CHECK+'</span>';
  function paintPaper(card,note){const paper=paperForTheme(normalizeHex(note.bg_color||note.color));card.style.setProperty("--card-accent",paper||accent);if(!paper)return"";const fg=textOnPaper(paper);card.style.setProperty("--card-fill",paper);card.style.setProperty("--card-fg",fg);card.style.setProperty("--card-fg2",mutedInk(fg,paper,.30,4.5));card.style.setProperty("--card-fg3",mutedInk(fg,paper,.48,3));card.style.setProperty("--card-soft","color-mix(in srgb, "+fg+" 11%, transparent)");return fg;}
  function noteCard(note){const card=document.createElement("article");card.className="card";card.dataset.key="n:"+note.id;
    paintPaper(card,note);card.style.setProperty("--priority",priorityColor(note.priority));
    const body=stripHtml(note.body_md).slice(0,280),tags=(note.tags||[]).slice(0,3).map((tag)=>"#"+safe(tag)).join(" · ");
    let actions="";
    if(view==="trash")actions='<button data-act="restore" title="'+safe(tS("hashi_restore","Restore"))+'">'+RESTORE+'</button><button data-act="delete" title="'+safe(tS("hashi_delete_forever","Delete forever"))+'">'+TRASH+'</button>';
    else{if(openGroup&&!query)actions+='<button data-act="takeout" title="'+safe(tS("hashi_take_out_of_group","Take out of group"))+'">'+TAKEOUT+'</button>';
      actions+='<button data-act="trash" title="'+safe(tS("hashi_move_to_trash","Move to trash"))+'">'+TRASH+'</button>';}
    const icon=iconHtml(note.icon),title=safe(note.title),keep=safe(keepLabel(note));
    card.innerHTML='<div class="card-top">'+(icon?'<div class="card-icon">'+icon+'</div>':'')+'<div class="card-title-wrap">'+(title?'<div class="card-title">'+title+'</div>':'')+'<div class="card-age">'+safe(relativeDate(note.updated_at||note.created_at))+'</div></div><span class="priority-dot"></span></div><div class="card-body'+(body?'':' empty')+'">'+(safe(body)||safe(tS("hashi_empty_note","Empty note")))+'</div><div class="card-footer">'+(keep?'<span class="keep-chip">'+keep+'</span>':'')+(tags?'<span class="tags">'+tags+'</span>':'')+'</div><div class="actions">'+actions+'</div>'+SEL_BADGE;
    card.addEventListener("click",(event)=>{if(suppressClick)return;

  function noteAction(action,note){

    else if(action==="delete")pycmd("hashi:delete:"+note.id);

  function groupCard(group){const card=document.createElement("article");card.className="card groupcard";card.dataset.key="g:"+group.id;
    const members=notesInGroup(group.id),shown=members.slice(0,members.length>4?3:4);
    const tiles=shown.map((note)=>{const probe=document.createElement("div"),fg=paintPaper(probe,note),paper=probe.style.getPropertyValue("--card-fill");
      const face=iconHtml(note.icon)||('<span>'+safe((note.title||stripHtml(note.body_md)||tS("hashi_empty_note","Empty note")).slice(0,22))+'</span>');

    card.addEventListener("click",(event)=>{if(suppressClick)return;
      const button=event.target.closest("button[data-act]");

  function ungroup(group){ensureManual();let next=topLevelItems().length;notesInGroup(group.id).forEach((note)=>{note.group="";note.order=next++;});groups=groups.filter((other)=>other.id!==group.id);

  function newCard(){const card=document.createElement("article");card.className="card newcard";card.innerHTML='<div class="new-plus">'+PLUS+'</div><div class="new-title">'+safe(tS("hashi_new_note","New note"))+'</div><div class="new-sub">'+safe(tS("hashi_new_note_sub","Capture it before it slips away"))+'</div>';card.addEventListener("click",()=>{if(!suppressClick)openNote("hashi:new");});return card;}

  // ── Selection ──────────────────────────────────────────────────────────────

  function clickSelects(event,key){

  function syncSelection(){const live=new Set(renderedItems.map(keyOf));
    Array.from(selection).forEach((key)=>{if(!live.has(key))selection.delete(key);});
    $("grid").querySelectorAll(".card[data-key]").forEach((el)=>el.classList.toggle("is-selected",selection.has(el.dataset.key)));

  function groupSelection(){const items=Array.from(selection).map(itemForKey).filter(Boolean);if(items.length<2)return;

    items.forEach((item)=>{
      if(item.kind==="note"){if(item.note.group===group.id)return;item.note.group=group.id;item.note.order=next++;}
      else{if(item.group.id===group.id)return;

  // ── Chrome: group header + selection bar ───────────────────────────────────
  function renderChrome(){const head=$("grouphead"),bar=$("selbar"),group=openGroup?groupById(openGroup):null;
    if(group&&!query&&view==="active"){const count=notesInGroup(group.id).length;
      head.hidden=false;
      head.innerHTML='<button class="barbtn" data-act="back">'+BACK+'<span>'+safe(tS("hashi_back","Back"))+'</span></button><div class="grouphead-title" contenteditable="true" spellcheck="false">'+safe(group.title||tS("hashi_group","Group"))+'</div><span class="grouphead-count">'+count+" "+safe(tS("hashi_group_notes_suffix","notes"))+'</span><button class="barbtn" data-act="ungroup">'+UNGROUP+'<span>'+safe(tS("hashi_ungroup","Ungroup"))+'</span></button>';}
    else{head.hidden=true;head.innerHTML="";}
    if(!selection.size){bar.hidden=true;bar.innerHTML="";return;}
    const parts=['<span class="count">'+selection.size+" "+safe(tS("hashi_selected","selected"))+'</span><span class="hint">'+safe(tS("hashi_selection_hint","Click cards to add · drag one to move them all"))+'</span>'];
    if(view==="trash")parts.push('<button class="barbtn primary" data-act="restore">'+RESTORE+'<span>'+safe(tS("hashi_restore","Restore"))+'</span></button>','<button class="barbtn danger" data-act="delete">'+TRASH+'<span>'+safe(tS("hashi_delete_forever","Delete forever"))+'</span></button>');
    else{if(openGroup)parts.push('<button class="barbtn" data-act="takeout">'+TAKEOUT+'<span>'+safe(tS("hashi_take_out_of_group","Take out"))+'</span></button>');
      else if(selection.size>1)parts.push('<button class="barbtn primary" data-act="group">'+STACK+'<span>'+safe(tS("hashi_group_action","Group"))+'</span></button>');
      parts.push('<button class="barbtn danger" data-act="trash">'+TRASH+'<span>'+safe(tS("hashi_move_to_trash","Move to trash"))+'</span></button>');}
    parts.push('<button class="barbtn" data-act="clear">'+safe(tS("hashi_clear","Clear"))+'</button>');
    bar.hidden=false;bar.innerHTML=parts.join("");}
  $("grouphead").addEventListener("click",(event)=>{const button=event.target.closest("button[data-act]");if(!button)return;
    if(button.dataset.act==="back")exitGroup();else{const group=groupById(openGroup);if(group)ungroup(group);}});
  $("grouphead").addEventListener("blur",(event)=>{const el=event.target.closest(".grouphead-title");if(!el)return;
    const group=groupById(openGroup);if(!group)return;
    group.title=(el.textContent||"").trim().slice(0,80)||tS("hashi_group","Group");el.textContent=group.title;persistLayout();},true);
  $("grouphead").addEventListener("keydown",(event)=>{if(event.target.closest(".grouphead-title")&&event.key==="Enter"){event.preventDefault();event.target.blur();}});
  $("selbar").addEventListener("click",(event)=>{const button=event.target.closest("button[data-act]");if(!button)return;
    const action=button.dataset.act,ids=selectionNoteIds();
    if(action==="clear"){clearSelection();return;}
    if(action==="group"){groupSelection();return;}
    if(action==="takeout"){ensureManual();let next=topLevelItems().length;
      Array.from(selection).map(itemForKey).forEach((item)=>{if(item&&item.kind==="note"){item.note.group="";item.note.order=next++;}});
      selection.clear();persistLayout();render();return;}
    if(!ids.length)return;
    if(action==="trash")pycmd("hashi:trash_many:"+ids.join(","));
    else if(action==="restore")pycmd("hashi:restore_many:"+ids.join(","));
    else if(action==="delete")pycmd("hashi:delete_many:"+ids.join(","));});

  // ── Render ─────────────────────────────────────────────────────────────────
  function render(){const grid=$("grid");grid.innerHTML="";
    if(openGroup&&(!groupById(openGroup)||!notesInGroup(openGroup).length))openGroup=null;
    renderedItems=sorted(currentItems());
    const live=new Set(renderedItems.map(keyOf));
    Array.from(selection).forEach((key)=>{if(!live.has(key))selection.delete(key);});
    renderChrome();
    if(view==="active"&&!query&&!openGroup)grid.appendChild(newCard());
    if(!renderedItems.length){
      if(query)grid.appendChild(emptyState(tS("hashi_no_matches","No matching notes"),tS("hashi_no_matches_sub","Try another word or tag.")));
      else if(view==="trash")grid.appendChild(emptyState(tS("hashi_trash_empty","Trash is empty."),"Notes moved here can be restored."));}
    renderedItems.forEach((item)=>{const card=item.kind==="group"?groupCard(item.group):noteCard(item.note);
      if(selection.has(keyOf(item)))card.classList.add("is-selected");
      grid.appendChild(card);});}

  // ── Dragging: reorder, and drop-onto-a-card to group ───────────────────────
  // Raw pointer events rather than HTML5 drag-and-drop: the merge dwell timer,
  // the multi-card ghost stack and edge auto-scroll all need live coordinates
  // the native drag events never give up.
  const grid=$("grid"),canvas=document.querySelector(".canvas");
  let pending=null,drag=null,suppressClick=false;
  const canArrange=()=>view==="active"&&!query;   // trash and search results stay fixed
  const canMerge=()=>canArrange()&&!openGroup;    // no groups inside groups
  grid.addEventListener("pointerdown",(event)=>{
    if(event.button!==0||!canArrange())return;
    const card=event.target.closest(".card[data-key]");
    if(!card||event.target.closest("button")||event.target.closest("[contenteditable='true']"))return;
    pending={card:card,x:event.clientX,y:event.clientY};
    window.addEventListener("pointermove",onPointerMove);
    window.addEventListener("pointerup",onPointerUp,{once:true});});
  function onPointerMove(event){
    if(!drag){if(Math.hypot(event.clientX-pending.x,event.clientY-pending.y)<6)return;startDrag(event);}
    updateDrag(event);}
  function startDrag(event){const key=pending.card.dataset.key;
    if(!selection.has(key)){selection.clear();syncSelection();}
    const keys=selection.has(key)?renderedItems.map(keyOf).filter((k)=>selection.has(k)):[key];
    const els=keys.map((k)=>grid.querySelector('.card[data-key="'+k+'"]')).filter(Boolean);
    if(!els.length)return;
    const anchorRect=pending.card.getBoundingClientRect();
    const holder=document.createElement("div");holder.className="drop-holder";
    grid.insertBefore(holder,pending.card);
    const ghosts=els.slice(0,3).map((el,index)=>{const rect=el.getBoundingClientRect(),ghost=el.cloneNode(true);
      ghost.classList.remove("is-selected","is-dragging");ghost.classList.add("drag-ghost");
      const actions=ghost.querySelector(".actions");if(actions)actions.remove();
      const badge=ghost.querySelector(".sel-badge");if(badge)badge.remove();
      ghost.style.width=rect.width+"px";ghost.style.height=rect.height+"px";ghost.style.zIndex=String(900-index);
      document.body.appendChild(ghost);
      return {el:ghost,dx:index*8,dy:index*8,rot:index*1.7};});
    ghosts.reverse();   // paint the stack back-to-front, dragged card on top
    if(els.length>1){const count=document.createElement("span");count.className="drag-count";count.textContent=String(els.length);ghosts[ghosts.length-1].el.appendChild(count);}
    els.forEach((el)=>el.classList.add("is-dragging"));
    document.body.classList.add("is-dragging-cards");
    drag={keys:keys,els:els,ghosts:ghosts,holder:holder,merge:null,hover:null,timer:0,offX:event.clientX-anchorRect.left,offY:event.clientY-anchorRect.top};}
  function updateDrag(event){if(!drag)return;const x=event.clientX,y=event.clientY;
    drag.ghosts.forEach((ghost)=>{ghost.el.style.transform="translate("+(x-drag.offX+ghost.dx)+"px,"+(y-drag.offY+ghost.dy)+"px) rotate("+ghost.rot+"deg)";});
    autoScroll(y);
    const over=mergeCandidate(x,y);
    if(over!==drag.hover){clearTimeout(drag.timer);drag.hover=over;setMerge(null);
      if(over)drag.timer=setTimeout(()=>{if(drag)setMerge(over);},170);}
    if(!drag.merge)moveHolder(x,y);}
  // A card only becomes a grouping target when the pointer rests inside its
  // middle; the outer band still reads as "drop between these two".
  function mergeCandidate(x,y){if(!canMerge())return null;
    const under=document.elementFromPoint(x,y),card=under&&under.closest?under.closest(".card[data-key]"):null;
    if(!card||card.classList.contains("is-dragging"))return null;
    const rect=card.getBoundingClientRect(),insetX=rect.width*.26,insetY=rect.height*.24;
    return(x>rect.left+insetX&&x<rect.right-insetX&&y>rect.top+insetY&&y<rect.bottom-insetY)?card:null;}
  function setMerge(card){if(drag.merge===card)return;
    if(drag.merge)drag.merge.classList.remove("is-merge");
    drag.merge=card;
    if(card){card.classList.add("is-merge");drag.holder.style.display="none";}
    else drag.holder.style.display="";}
  function moveHolder(x,y){const cards=Array.from(grid.children).filter((el)=>el.classList.contains("card")&&!el.classList.contains("is-dragging"));
    let ref=null;
    for(const el of cards){const rect=el.getBoundingClientRect();
      if(y<rect.top){ref=el;break;}
      if(y<=rect.bottom&&x<rect.left+rect.width/2){ref=el;break;}}
    if(ref&&ref.classList.contains("newcard"))ref=ref.nextElementSibling;
    if(ref===drag.holder)return;
    grid.insertBefore(drag.holder,ref||null);}
  function autoScroll(y){const rect=canvas.getBoundingClientRect(),edge=70;
    if(y<rect.top+edge)canvas.scrollTop-=Math.ceil((rect.top+edge-y)/5);
    else if(y>rect.bottom-edge)canvas.scrollTop+=Math.ceil((y-(rect.bottom-edge))/5);}
  function dropIndex(){let index=0;
    for(const el of Array.from(grid.children)){
      if(el===drag.holder)return index;
      if(el.dataset&&el.dataset.key&&!el.classList.contains("is-dragging"))index++;}
    return index;}
  function endDragVisuals(){clearTimeout(drag.timer);
    drag.ghosts.forEach((ghost)=>ghost.el.remove());
    if(drag.merge)drag.merge.classList.remove("is-merge");
    if(drag.holder.parentNode)drag.holder.remove();
    drag.els.forEach((el)=>el.classList.remove("is-dragging"));
    document.body.classList.remove("is-dragging-cards");}
  function onPointerUp(){window.removeEventListener("pointermove",onPointerMove);
    if(!drag){pending=null;return;}
    const mergeKey=drag.merge?drag.merge.dataset.key:null,index=dropIndex(),keys=drag.keys;
    endDragVisuals();drag=null;pending=null;
    suppressClick=true;setTimeout(()=>{suppressClick=false;},0);
    if(mergeKey)applyMerge(keys,mergeKey);else applyReorder(keys,index);
    persistLayout();render();}
  function cancelDrag(){if(!drag)return;endDragVisuals();drag=null;pending=null;
    window.removeEventListener("pointermove",onPointerMove);
    suppressClick=true;setTimeout(()=>{suppressClick=false;},0);render();}
  function applyReorder(keys,index){ensureManual();
    const moving=renderedItems.filter((item)=>keys.includes(keyOf(item)));
    const rest=renderedItems.filter((item)=>!keys.includes(keyOf(item)));
    rest.splice(Math.max(0,Math.min(index,rest.length)),0,...moving);
    rest.forEach((item,position)=>{
      if(item.kind==="group")item.group.order=position;
      else{item.note.order=position;item.note.group=openGroup||"";}});}
  function applyMerge(keys,targetKey){const target=itemForKey(targetKey);if(!target)return;
    if(keys.indexOf(targetKey)>=0)return;
    ensureManual();
    let group;
    if(target.kind==="group")group=target.group;
    else{group={id:newGroupId(),title:tS("hashi_group","Group"),order:target.note.order|0};groups.push(group);target.note.group=group.id;target.note.order=0;}
    absorb(keys.map(itemForKey).filter(Boolean),group);
    selection.clear();}

  // ── View / group navigation ────────────────────────────────────────────────
  // Cards leave towards the side we came from and enter from the other one, so
  // the swap has a direction that matches the pill's travel.
  function animateSwap(mutate,exit){const target=$("grid");
    target.style.setProperty("--swap-dx",exit+"px");target.classList.add("is-swapping");
    setTimeout(()=>{mutate();render();target.classList.add("no-anim");target.style.setProperty("--swap-dx",-exit+"px");void target.offsetWidth;target.classList.remove("no-anim");target.classList.remove("is-swapping");},150);}
  function enterGroup(id){animateSwap(()=>{openGroup=id;selection.clear();},-14);}
  function exitGroup(){animateSwap(()=>{openGroup=null;selection.clear();},14);}
  function swapView(next){const forward=next==="trash";
    animateSwap(()=>{view=next;openGroup=null;selection.clear();syncSeg();pycmd("hashi:set_view:"+view);},forward?-14:14);}

  // ── Wiring ─────────────────────────────────────────────────────────────────
  $("newBtn").addEventListener("click",()=>openNote("hashi:new"));
  $("search").addEventListener("input",(event)=>{query=event.target.value.trim().toLowerCase();selection.clear();render();});
  grid.addEventListener("click",(event)=>{if(event.target===grid&&selection.size)clearSelection();});
  const segButtons=Array.from($("viewseg").querySelectorAll("button")),segThumb=$("segThumb");
  function moveThumb(){const current=segButtons.find((button)=>button.classList.contains("on"))||segButtons[0];if(!current)return;segThumb.style.width=current.offsetWidth+"px";segThumb.style.transform="translateX("+current.offsetLeft+"px)";}
  function syncSeg(){segButtons.forEach((button)=>button.classList.toggle("on",button.dataset.view===view));moveThumb();}
  // First paint positions the pill with transitions still off; whichever of
  // the two unlocks lands first turns them on (rAF is throttled when the
  // webview starts hidden).
  function unlockThumb(){moveThumb();$("viewseg").classList.add("is-ready");}
  syncSeg();requestAnimationFrame(()=>requestAnimationFrame(unlockThumb));setTimeout(unlockThumb,80);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(moveThumb);
  window.addEventListener("resize",moveThumb);
  $("viewseg").addEventListener("click",(event)=>{const button=event.target.closest("button");if(!button||button.dataset.view===view)return;swapView(button.dataset.view);});
  const labels={manual:tS("hashi_sort_manual","Manual"),age:tS("hashi_sort_recent","Recent"),tags:tS("hashi_sort_tags","Tags"),priority:tS("hashi_sort_priority","Priority"),title:tS("hashi_sort_title","Title")};
  function refreshSort(){$("sortLabel").textContent=labels[sortKey]||labels.age;$("sortPop").querySelectorAll("button").forEach((button)=>button.classList.toggle("on",button.dataset.v===sortKey));}
  $("sortBtn").addEventListener("click",(event)=>{event.stopPropagation();$("sortPop").classList.toggle("open");});
  $("sortPop").addEventListener("click",(event)=>{const button=event.target.closest("button");if(!button)return;sortKey=button.dataset.v;refreshSort();$("sortPop").classList.remove("open");pycmd("hashi:set_sort:"+sortKey);render();});
  document.addEventListener("click",()=>$("sortPop").classList.remove("open"));
  document.addEventListener("keydown",(event)=>{
    if(event.key==="Escape"&&drag){event.preventDefault();cancelDrag();return;}
    if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==="a"&&document.activeElement!==$("search")){event.preventDefault();renderedItems.forEach((item)=>selection.add(keyOf(item)));syncSelection();return;}
    if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==="n"){event.preventDefault();openNote("hashi:new");return;}
    if(event.key==="Escape"){
      if(document.activeElement===$("search")){$("search").value="";query="";$("search").blur();render();return;}
      if(selection.size){clearSelection();return;}
      if(openGroup)exitGroup();}});
  refreshSort();render();
})();
</script>
</body>
</html>
