<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
<style>
  /*__HASHI_FONT_FACE__*/
  :root {
    --bg: #f4f4f1; --shell: #fbfbf9; --surface: #fff; --surface-2: #f0f0ec;
    --border: #deded8; --fg: #20211f; --fg2: #5d605b; --fg3: #92958e;
    --accent: #00a982; --paper: #fffefb; --paper-fill: var(--paper); --paper-edge: rgba(32,33,31,.09);
    --paper-fg: #20211f; --paper-fg2: #5d605b; --paper-fg3: #92958e; --paper-soft: rgba(32,33,31,.07);
    --marker: var(--accent); --chip: #ecece7; --hover: #e9e9e4;
    --shadow: 0 24px 70px rgba(24,28,25,.18), 0 2px 8px rgba(24,28,25,.08);
  }
  * { box-sizing: border-box; }
  html body button, html body input { font: inherit; }
  /* The dark ring around hovered buttons comes from Anki's own webview.css,
     which stdHtml injects ahead of this file:
         button:hover { border: 1px solid var(--shadow) }
     In night mode that variable is near-black. `button:hover` (0,1,1) outranks
     both `.icon-button` (0,1,0) and `html body button` (0,0,3), so plain
     `border: 0` loses the cascade - only !important reliably wins here.
     Borders on ::after (e.g. .swatch.on) and on inputs are unaffected. */
  html body button { appearance: none !important; -webkit-appearance: none !important; box-shadow: none !important; background-image: none !important; border: 0 !important; }
  html body button:hover, html body button:focus, html body button:active { border: 0 !important; }
  html body button:focus, html body button:focus-visible, html body input:focus-visible { outline: none !important; }
  * { -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; color: var(--fg); font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; }
  button { color: inherit; }
  svg { display: block; }
  .window-shell { position: absolute; inset: 10px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--border); border-radius: 26px; background: var(--shell); box-shadow: var(--shadow); opacity: 0; transform: translateY(4px) scale(.992); transition: opacity .16s ease, transform .18s ease; }
  .window-shell.hashi-in { opacity: 1; transform: none; }
  .windowbar { height: 54px; flex: 0 0 54px; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 17px; border-bottom: 1px solid var(--border); background: var(--shell); -webkit-user-select: none; user-select: none; cursor: default; }
  .brand { display: inline-flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-mark { position: relative; width: 28px; height: 28px; flex: 0 0 28px; border-radius: 9px; background: var(--accent); box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 28%, transparent); }
  .brand-mark::before, .brand-mark::after { content: ""; position: absolute; top: 6px; width: 2px; height: 16px; border-radius: 2px; background: #fff; transform: rotate(25deg); }
  .brand-mark::before { left: 10px; } .brand-mark::after { left: 16px; }
  .brand-copy { min-width: 0; }
  .brand-title { font-weight: 750; font-size: 13px; line-height: 1.15; white-space: nowrap; }
  .brand-sub { margin-top: 2px; color: var(--fg3); font-size: 10px; line-height: 1; white-space: nowrap; }
  .save-state { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; color: var(--fg3); font-size: 10.5px; font-weight: 600; white-space: nowrap; }
  .save-state::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .save-state.saving::before { animation: savePulse .8s ease-in-out infinite alternate; }
  @keyframes savePulse { to { opacity: .25; transform: scale(.75); } }
  .window-actions { display: flex; align-items: center; gap: 4px; margin-left: 3px; }
  .icon-button { width: 32px; height: 32px; padding: 0; border: 0; border-radius: 10px; background: transparent; color: var(--fg2); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: color .26s ease, background-color .26s ease, opacity .26s ease; }
  .icon-button:hover { color: var(--fg2); background: color-mix(in srgb, var(--fg) 6%, transparent); }
  .icon-button:active { background: color-mix(in srgb, var(--fg) 9%, transparent); }
  .icon-button svg { width: 17px; height: 17px; }
  #closeBtn:hover { color: var(--fg2); background: color-mix(in srgb, #e65353 14%, transparent); }
  .workspace { min-height: 0; flex: 1 1 auto; padding: 14px; background: var(--bg); }
  .note-paper { height: 100%; min-height: 0; position: relative; display: flex; flex-direction: column; overflow: hidden; border: 0; border-radius: 22px; background: var(--paper-fill); box-shadow: 0 12px 34px rgba(27,30,27,.10); }
  .paper-accent { display: none; }
  .note-heading { display: flex; align-items: center; gap: 10px; padding: 18px 18px 10px; }
  #noteicon { width: 42px; height: 42px; flex: 0 0 42px; padding: 0; border: 0; border-radius: 14px; background: var(--paper-soft); color: var(--paper-fg); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 20px; transition: background-color .26s ease; }
  #noteicon:hover { background: color-mix(in srgb, var(--paper-fg) 7%, transparent); }
  #noteicon img { width: 23px; height: 23px; object-fit: contain; }
  #noteicon .hashi-sysmask { width: 22px; height: 22px; }
  .hashi-sysmask { display: inline-block; background-color: currentColor; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: center; mask-position: center; -webkit-mask-size: contain; mask-size: contain; }
  #titleinput { flex: 1 1 auto; min-width: 0; padding: 5px 2px; border: 0; outline: 0; background: transparent; color: var(--paper-fg); font-size: 22px; font-weight: 760; letter-spacing: -.025em; -webkit-user-select: text; user-select: text; }
  #titleinput::placeholder { color: var(--paper-fg3); opacity: .72; }
  .is-hidden { display: none !important; }
  /* Title and icon are optional. With no title there is no flexible item left
     in the heading, so the controls are pinned right explicitly (a second
     margin-left:auto would just split the free space with .note-popup-actions). */
  .note-heading.is-flush { justify-content: flex-end; }
  .note-heading.is-flush #noteicon { margin-right: auto; }
  .note-heading.is-flush .note-controls { margin-left: 0; }
  /* Every heading control lives in one cluster with its own tight rhythm,
     so the group reads as a single small menu instead of items spaced at
     the heading's 10px gap. */
  .note-controls { display: flex; align-items: center; gap: 1px; margin-left: auto; }
  .note-controls .icon-button { width: 28px; height: 28px; border-radius: 9px; }
  .note-controls .icon-button svg { width: 16px; height: 16px; }
  /* Popup-only, like the buttons beside it: the window header carries its
     own .save-state. */
  #paperSaveState { display: none; }
  .popup-host #paperSaveState { display: inline-flex; margin-right: 4px; }
  #colorbtn, #detailsBtn { color: var(--paper-fg2); }
  #colorbtn:hover, #detailsBtn:hover { color: var(--paper-fg2); background: color-mix(in srgb, var(--paper-fg) 6%, transparent); }
  #colorbtn .color-dot { width: 17px; height: 17px; border-radius: 50%; background: var(--paper-fill); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--paper-fg) 25%, transparent), 0 0 0 3px var(--paper-soft); }
  #colorbtn .color-dot.empty { background: var(--paper-fill); box-shadow: inset 0 0 0 1.5px var(--paper-fg3); }
  #editor { flex: 1 1 auto; min-height: 90px; overflow-y: auto; margin: 5px 0 0; padding: 15px 22px 20px; outline: none; color: var(--paper-fg); background: transparent; font-size: 14px; line-height: 1.68; -webkit-user-select: text; user-select: text; }
  #editor:empty::before { content: attr(data-placeholder); color: var(--paper-fg3); opacity: .78; }
  #editor > div { min-height: 1.55em; }
  #editor::-webkit-scrollbar, .popover::-webkit-scrollbar { width: 7px; }
  #editor::-webkit-scrollbar-thumb, .popover::-webkit-scrollbar-thumb { border-radius: 10px; background: color-mix(in srgb, var(--fg3) 36%, transparent); }
  .hl { padding: 0 2px; border-radius: 4px; background: #fff3b0; color: #332f16; }
  .hl-clear { padding: 0 2px; border-radius: 4px; background: var(--paper-fill) !important; color: var(--paper-fg) !important; }
  code, .code { padding: 2px 5px; border-radius: 6px; background: var(--chip); font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .bullet { position: relative; padding-left: 19px; } .bullet::before { content: "•"; position: absolute; left: 5px; color: var(--marker); }
  .todo { position: relative; padding-left: 24px; } .todo .box { position: absolute; left: 2px; top: 4px; width: 15px; height: 15px; border: 1.5px solid var(--fg3); border-radius: 5px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; }
  .todo.done .box { color: #fff; border-color: var(--marker); background: var(--marker); } .todo.done .txt { color: var(--fg3); text-decoration: line-through; }
  .toggle { position: relative; padding-left: 20px; } .toggle > .arrow { position: absolute; left: 2px; color: var(--fg2); cursor: pointer; transition: transform .15s; } .toggle.closed > .arrow { transform: rotate(-90deg); } .toggle.closed > .body { display: none; }
  .hd1 { margin: 5px 0; font-size: 21px; line-height: 1.35; font-weight: 760; } .hd2 { margin: 4px 0; font-size: 17px; line-height: 1.4; font-weight: 720; }
  .card-chip { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 999px; color: #fff; background: var(--marker); font-size: 11.5px; font-weight: 650; }
  .hashi-inline-icon { width: 1.1em; height: 1.1em; vertical-align: -.15em; }
  .tags-field { min-width: 0; width: 100%; display: flex; align-items: center; gap: 7px; height: 36px; padding: 0 10px; border: 0; border-radius: 11px; color: var(--fg3); background: var(--surface-2); transition: box-shadow .12s; }
  .tags-field:focus-within { color: var(--accent); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
  .tags-field svg { width: 15px; height: 15px; flex: 0 0 auto; }
  #tags { min-width: 0; width: 100%; padding: 0; border: 0; outline: 0; color: var(--fg2); background: transparent; font-size: 11.5px; }
  #tags::placeholder { color: var(--fg3); }
  .popover { position: fixed; z-index: 80; display: none; overflow-x: hidden; overflow-y: auto; max-width: calc(100vw - 24px); padding: 10px; border: 0; border-radius: 16px; background: var(--surface); box-shadow: 0 18px 50px rgba(20,24,21,.2), 0 2px 8px rgba(20,24,21,.08); }
  .popover.open { display: block; animation: popIn .12s ease-out; } @keyframes popIn { from { opacity: 0; transform: translateY(4px) scale(.98); } }
  .pop-title { margin: 2px 3px 9px; color: var(--fg3); font-size: 9.5px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
  #palette { width: 276px; }
  .swatch-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; }
  .swatch { position: relative; width: 30px; height: 30px; margin: auto; border: 0; border-radius: 10px; background: var(--swatch, transparent); cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1) !important; transition: transform .26s ease, opacity .26s ease; }
  .swatch:hover { transform: scale(1.03); opacity: .88; } .swatch.on::after { content: ""; position: absolute; inset: -3px; border: 2px solid var(--fg); border-radius: 50%; }
  /* Two separate Anki rules have to be beaten here, both at (0,1,1) - hence the
     (0,2,0) selector below.
     1. stdHtml puts `fancy` on <body>, so `.fancy button` rounds every swatch to
        a full circle, overriding `.swatch`. The ::after ring is a pseudo-element
        that rule never reached, which is why a squircle ring sat around circular
        swatches. Both are pinned circular rather than left to chance.
     2. `button:hover` sets the `background` *shorthand*, which resets
        background-color to transparent; the button reset near the top of this
        file then strips its gradient, so a hovered swatch lost its colour
        entirely. Restating the colour here fixes that.
     `.swatch.none`/`.custom` follow below and still win for their own variants. */
  .popover .swatch { border-radius: 50%; background: var(--swatch, transparent); }
  .swatch.none { background: var(--surface); } .swatch.none::before { content: ""; position: absolute; left: 7px; right: 7px; top: 14px; height: 1.5px; border-radius: 2px; background: var(--fg3); transform: rotate(-45deg); }
  .swatch.custom { background: var(--surface-2); color: var(--fg2); } .swatch.custom::before { content: "+"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 500; }
  #iconPicker { width: min(342px, calc(100vw - 24px)); max-height: min(440px, calc(100vh - 28px)); padding: 12px; }
  .icon-search { width: 100%; height: 34px; padding: 0 11px; border: 1px solid var(--border); border-radius: 11px; outline: 0; color: var(--fg); background: var(--surface-2); font-size: 11.5px; }
  .icon-search:focus { border-color: var(--accent); }
  #iconResults { min-width: 0; max-height: 326px; overflow-x: hidden; overflow-y: auto; padding-right: 2px; }
  .icon-section { min-width: 0; margin-top: 12px; } .icon-section-label { margin: 0 2px 7px; color: var(--fg3); font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; }
  .icon-grid { min-width: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 5px; }
  .icon-choice { min-width: 0; width: 100%; height: 36px; padding: 6px; border: 0; border-radius: 10px; color: var(--fg2); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; overflow: hidden; transition: background-color .26s ease; }
  .icon-choice:hover { color: var(--fg2); background: color-mix(in srgb, var(--fg) 6%, transparent); } .icon-choice img, .icon-choice .hashi-sysmask { width: 21px; height: 21px; object-fit: contain; }
  .icon-empty { padding: 18px 4px; color: var(--fg3); text-align: center; font-size: 11px; }
  .clear-icon { width: 100%; height: 32px; margin-top: 9px; border: 0; border-radius: 10px; color: var(--fg2); background: var(--surface-2); cursor: pointer; font-size: 11px; transition: background-color .26s ease; }
  .clear-icon:hover { background: color-mix(in srgb, var(--fg) 8%, transparent); }
  .detail-input { width: 100%; height: 36px; padding: 0 11px; border: 0; border-radius: 11px; outline: 0; color: var(--fg); background: var(--surface-2); font-size: 11px; }
  .detail-input::placeholder { color: var(--fg3); }
  .detail-icon-preview { width: 18px; height: 18px; flex: 0 0 18px; display: inline-flex; align-items: center; justify-content: center; color: var(--fg2); font-size: 15px; }
  .detail-icon-preview img, .detail-icon-preview .hashi-sysmask { width: 16px; height: 16px; object-fit: contain; }
  #detailsPanel { width: 318px; padding: 14px; } .detail-group + .detail-group { margin-top: 14px; }
  .detail-label { display: block; margin: 0 2px 7px; color: var(--fg3); font-size: 9.5px; font-weight: 750; letter-spacing: .07em; text-transform: uppercase; }
  .pillgroup { display: flex; gap: 5px; padding: 3px; border-radius: 12px; background: var(--surface-2); }
  .pillgroup button { flex: 1 1 auto; height: 30px; padding: 0 8px; border: 0; border-radius: 9px; color: var(--fg2); background: transparent; cursor: pointer; font-size: 10.5px; transition: background-color .26s ease; }
  .pillgroup button:hover { background: color-mix(in srgb, var(--fg) 6%, transparent); } .pillgroup button.on { color: #fff; background: var(--accent); font-weight: 650; }
  .detail-hint { margin: 8px 2px 0; color: var(--fg3); font-size: 9.5px; line-height: 1.45; }
  .paper-color-row { width: 100%; height: 36px; padding: 0 10px; border: 0; border-radius: 11px; background: var(--surface-2); color: var(--fg2); cursor: pointer; display: flex; align-items: center; gap: 9px; font-size: 11px; text-align: left; transition: background-color .26s ease; }
  .paper-color-row:hover { background: color-mix(in srgb, var(--fg) 8%, transparent); } .paper-color-preview { width: 18px; height: 18px; flex: 0 0 18px; border-radius: 6px; background: var(--paper-fill); box-shadow: inset 0 0 0 1px rgba(0,0,0,.12) !important; }
  .color-editor { display: none; margin-top: 11px; padding-top: 11px; border-top: 1px solid var(--border); }
  .color-editor.open { display: block; }
  .color-sv { position: relative; width: 100%; height: 118px; overflow: hidden; border-radius: 12px; cursor: crosshair; touch-action: none; background-color: hsl(var(--picker-hue, 0), 100%, 50%); background-image: linear-gradient(to top, #000, transparent), linear-gradient(to right, #fff, transparent); }
  .color-cursor { position: absolute; width: 14px; height: 14px; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 1px 4px rgba(0,0,0,.45) !important; transform: translate(-50%,-50%); pointer-events: none; }
  .hue-range { width: 100%; height: 16px; margin: 10px 0 8px; padding: 0; border: 0; appearance: none; border-radius: 999px; outline: 0; background: linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00); }
  .hue-range::-webkit-slider-thumb { width: 18px; height: 18px; appearance: none; border: 2px solid #fff; border-radius: 50%; background: hsl(var(--picker-hue, 0),100%,50%); box-shadow: 0 1px 5px rgba(0,0,0,.35) !important; cursor: pointer; }
  .color-entry { display: flex; align-items: center; gap: 8px; }
  .color-preview { width: 32px; height: 32px; flex: 0 0 32px; border-radius: 10px; background: var(--picker-color); box-shadow: inset 0 0 0 1px rgba(0,0,0,.1) !important; }
  .hex-field { min-width: 0; flex: 1 1 auto; height: 32px; padding: 0 10px; border: 0; border-radius: 10px; outline: 0; color: var(--fg); background: var(--surface-2); font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; text-transform: uppercase; }
  .hex-field:focus { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--accent) 38%, transparent); }
  #cardpick { width: 320px; max-height: 230px; padding: 5px; } #cardpick .row { padding: 8px 9px; border-radius: 10px; cursor: pointer; font-size: 11.5px; }
  #cardpick .row { transition: background-color .26s ease; }
  #cardpick .row:hover, #cardpick .row.sel { background: color-mix(in srgb, var(--fg) 6%, transparent); } #cardpick .deck { margin-top: 2px; color: var(--fg3); font-size: 9.5px; }
  .resize-handle { position: fixed; z-index: 100; }
  /* Resizing is deliberately limited to the bottom edge and the two bottom
     corners: the top edge is the drag rail, and top handles both stole those
     grab pixels and let the window's anchored top corner drift. */
  .resize-handle.bottom { left: 20px; right: 20px; bottom: 4px; height: 7px; cursor: ns-resize; }
  .resize-handle.corner { width: 14px; height: 14px; } .resize-handle.bottomleft { left: 3px; bottom: 3px; cursor: nesw-resize; } .resize-handle.bottomright { right: 3px; bottom: 3px; cursor: nwse-resize; }
  body.gallery-host { background: var(--bg); }
  .gallery-host .window-shell { inset: 0; border: 0; border-radius: 0; box-shadow: none; }
  .gallery-host .workspace { padding: clamp(18px, 3vw, 34px); }
  .gallery-host .note-paper { width: min(760px, 100%); margin: 0 auto; }
  .gallery-host .resize-handle { display: none; }
  .popup-host .workspace { padding: 0; background: var(--paper-fill); }
  .popup-host .window-shell { inset: 0; border: 0; border-radius: 26px; background: var(--paper-fill); box-shadow: none; }
  .popup-host .windowbar { display: none; }
  .popup-host .note-paper { border-radius: 26px; box-shadow: none; }
  .popup-host .note-heading { cursor: grab; }
  .popup-host .note-heading:active { cursor: grabbing; }
  /* The floating note has no separate paper inset, so keep its first line
     close to the heading controls. The gallery keeps the roomier editor
     spacing above. */
  .popup-host #editor { margin-top: 0; padding-top: 0; }
  .popup-drag-rail { display: none; }
  .popup-host .popup-drag-rail { display: flex; flex: 0 0 16px; align-items: center; justify-content: center; cursor: grab; -webkit-user-select: none; user-select: none; touch-action: none; }
  .popup-host .popup-drag-rail:active { cursor: grabbing; }
  .popup-drag-rail::before { content: ""; width: 34px; height: 4px; border-radius: 2px; background: var(--paper-fg3); opacity: .35; }
  .note-popup-actions { display: none; align-items: center; gap: 1px; }
  .popup-host .note-popup-actions { display: flex; }
  .note-controls .save-state { margin-left: 0; color: var(--paper-fg2); }
  /* The status dot is the note's own ink, not the app accent: on a light
     paper it lands dark, on a dark one light, so it stays visible whatever
     colour the note is painted. */
  .note-controls .save-state::before { background: var(--paper-fg2); }
  .note-controls .icon-button { color: var(--paper-fg2); }
  .note-controls .icon-button:hover { color: var(--paper-fg); background: var(--paper-soft); }
  #paperCloseBtn:hover { color: var(--paper-fg2); background: color-mix(in srgb, #e65353 14%, transparent); }
  @media (max-width: 430px), (max-height: 540px) { .workspace { padding: 10px; } .window-shell { border-radius: 22px; } .note-paper { border-radius: 18px; } .note-heading { padding: 13px 13px 8px; } #editor { padding: 12px 17px 15px; } .brand-sub, .save-state { display: none; } }
</style>
</head>
<body>
<div class="window-shell" id="shell">
  <div class="popup-drag-rail" id="dragRail"></div>
  <header class="windowbar" id="windowbar">
    <div class="brand"><span class="brand-mark"></span><div class="brand-copy"><div class="brand-title" data-i18n-text="hashi_notes_title">Hashi Notes</div><div class="brand-sub" data-i18n-text="hashi_quick_note">Quick note</div></div></div>
    <div class="save-state" id="saveState" data-i18n-text="hashi_saved">Saved</div>
    <div class="window-actions">
      <button class="icon-button" id="backbtn" data-i18n-title="hashi_back_to_notes" title="Back to Notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <button class="icon-button" id="collectionBtn" data-i18n-title="hashi_browse_previous" title="Browse previous notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 8h10M7 12h7M7 16h4"/></svg></button>
      <button class="icon-button" id="closeBtn" data-i18n-title="hashi_close" title="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
    </div>
  </header>

  function reformatBlock(block){if(!block||block.querySelector(".card-chip"))return;let raw=block.textContent||"",cls="",prefix="";if(/^##\s/.test(raw)){cls="hd2";raw=raw.replace(/^##\s/,"");}else if(/^#\s/.test(raw)){cls="hd1";raw=raw.replace(/^#\s/,"");}else if(/^-\s/.test(raw)){cls="bullet";raw=raw.replace(/^-\s/,"");}else if(/^\[( |x|X)\]\s/.test(raw)){const done=/^\[(x|X)\]/.test(raw);cls="todo"+(done?" done":"");prefix='<span class="box" contenteditable="false">'+(done?"✓":"")+'</span><span class="txt">';raw=raw.replace(/^\[( |x|X)\]\s/,"");}else if(/^>\s/.test(raw)){cls="toggle";prefix='<span class="arrow" contenteditable="false">▾</span><span class="body">';raw=raw.replace(/^>\s/,"");}block.className=cls;const suffix=cls.startsWith("todo")||cls==="toggle"?"</span>":"";block.innerHTML=prefix+(inlineFormat(raw)||"<br>")+suffix;caretToEnd(block);renderMath(block);}
  function renderMath(scope){if(!window.renderMathInElement)return;try{window.renderMathInElement(scope,{delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}],throwOnError:false});}catch(e){}}
  editor.addEventListener("keydown",(event)=>{if(event.key==="@")setTimeout(openCardPick,0);if(event.key===" "){const block=currentBlock(),raw=block?block.textContent||"":"";if(/^(#{1,2}|-|>|\[( |x|X)\])\s?$/.test(raw+" ")||/(`[^`]+`|==[^=]+==|\*\*[^*]+\*)$/.test(raw))setTimeout(()=>reformatBlock(block),0);}}); editor.addEventListener("input",()=>{if(!editor.firstChild)editor.appendChild(document.createElement("div"));scheduleSave();}); editor.addEventListener("click",(event)=>{const box=event.target.closest(".box");if(box){const todo=box.closest(".todo");todo.classList.toggle("done");box.textContent=todo.classList.contains("done")?"✓":"";scheduleSave();return;}const arrow=event.target.closest(".arrow");if(arrow)arrow.closest(".toggle").classList.toggle("closed");});
  function selectionInEditor(){const selection=window.getSelection();if(!selection.rangeCount)return false;let node=selection.getRangeAt(0).commonAncestorContainer;while(node){if(node===editor)return true;node=node.parentNode;}return false;}
  function insertAtCaret(node,savedRange){editor.focus();const selection=window.getSelection();if(savedRange){selection.removeAllRanges();selection.addRange(savedRange);}if(!selection.rangeCount||!selectionInEditor()){editor.appendChild(node);return;}const range=selection.getRangeAt(0);range.deleteContents();range.insertNode(node);range.setStartAfter(node);range.collapse(true);selection.removeAllRanges();selection.addRange(range);}
  const cardpick=$("cardpick");let pickQuery="",pickSel=0,pickResults=[],pickActive=false;function openCardPick(){pickActive=true;pickQuery="";pickSel=0;const selection=window.getSelection();if(selection.rangeCount){const rect=selection.getRangeAt(0).getBoundingClientRect();cardpick.style.left=Math.max(16,Math.min(rect.left,window.innerWidth-336))+"px";cardpick.style.top=Math.min(rect.bottom+5,window.innerHeight-245)+"px";}cardpick.classList.add("open");pycmd("hashi:search_cards:");}function closeCardPick(){pickActive=false;cardpick.classList.remove("open");}window.hashiReceiveCards=function(results){if(!pickActive)return;pickResults=results||[];pickSel=0;renderCardPick();};
  function renderCardPick(){cardpick.innerHTML="";if(!pickResults.length){cardpick.innerHTML='<div class="row">'+tS("hashi_no_cards","No cards")+"</div>";return;}pickResults.forEach((card,index)=>{const row=document.createElement("div");row.className="row"+(index===pickSel?" sel":"");const title=document.createElement("div");title.textContent=card.label||"card";const deck=document.createElement("div");deck.className="deck";deck.textContent=card.deck||"";row.append(title,deck);row.addEventListener("mousedown",(event)=>{event.preventDefault();chooseCard(card);});cardpick.appendChild(row);});}function chooseCard(card){const chip=document.createElement("span");chip.className="card-chip";chip.contentEditable="false";chip.dataset.card=card.id;chip.textContent="@"+(card.label||"card").slice(0,24);insertAtCaret(chip);insertAtCaret(document.createTextNode(" "));closeCardPick();scheduleSave();}
  editor.addEventListener("keydown",(event)=>{if(!pickActive)return;if(event.key==="Escape"){event.preventDefault();closeCardPick();}else if(event.key==="ArrowDown"){event.preventDefault();pickSel=Math.min(pickSel+1,pickResults.length-1);renderCardPick();}else if(event.key==="ArrowUp"){event.preventDefault();pickSel=Math.max(pickSel-1,0);renderCardPick();}else if(event.key==="Enter"&&pickResults[pickSel]){event.preventDefault();chooseCard(pickResults[pickSel]);}else if(event.key==="Backspace"&&!pickQuery)closeCardPick();else if(event.key.length===1)setTimeout(()=>{pickQuery+=event.key;pycmd("hashi:search_cards:"+pickQuery);},0);});
  document.addEventListener("mousedown",(event)=>{if(!event.target.closest(".popover,#colorbtn,#noteicon,#detailsBtn,#detailsColorBtn,#detailsIconBtn"))closePopovers();if(!cardpick.contains(event.target))closeCardPick();}); window.addEventListener("beforeunload",flush);
  applyColors();loadKatex();editor.focus();
})();
