<main class="onigimon-app">
  <section class="hero" data-bind="hero">
    <div class="companion-stage">
      <div class="hero-background" data-bind="background" aria-hidden="true"></div>
      <div class="fx-layer" aria-hidden="true"></div>
      <button class="companion-display" type="button" data-action="pet" data-i18n-alabel="pet" aria-label="Pet companion">
        <img class="companion-sprite" data-bind="sprite" alt="">
      </button>
      <div class="companion-speech" data-bind="speech" aria-hidden="true">
        <span class="speech-size"></span>
        <span class="speech-typed"></span>
      </div>
      <span class="speech-announcement" data-bind="speech-announcement" role="status" aria-atomic="true"></span>
      <p class="live-status" data-bind="message"></p>
    </div>
    <aside class="care-panel">
      <div data-bind="care-overview">
        <div class="companion-meta"><strong data-bind="name" data-i18n-text="companion">Companion</strong><span data-bind="level">Level 1</span></div>
        <div class="status-list" data-bind="statuses"></div>
      </div>
      <section id="care-backpack" class="backpack-category-view" data-bind="backpack-category-view" aria-labelledby="care-backpack-title" hidden>
        <header class="backpack-category-heading">
          <button class="backpack-return" type="button" data-action="close-category"
            data-i18n-alabel="back" aria-label="Back" aria-describedby="care-backpack-title">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
          </button>
          <h2 id="care-backpack-title">
            <span class="backpack-section-label" data-i18n-text="backpack">Backpack</span>
            <span data-bind="backpack-category"></span>
          </h2>
          <span class="category-dock-icon" aria-hidden="true"></span>
        </header>
        <div class="backpack-item-grid" data-bind="backpack-items"></div>
      </section>
    </aside>
  </section>
  <section class="market-panel">
    <header class="market-head"><div class="market-identity"><img data-bind="mart" alt=""><div><p class="market-kicker">CARE SUPPLIES</p><h1 data-bind="market-title">Daily Market</h1><p class="market-lead">Fresh items for your companion, restocked every day.</p></div></div><div class="market-actions"><div class="wallet"><span><img data-bind="comet" alt=""><b data-bind="comets">0</b></span><span><img data-bind="star-piece" alt=""><b data-bind="stars">0</b></span></div><button class="redeem-btn" data-action="open-redeem">Redeem</button></div></header>
    <button class="gift-btn" data-action="gift"></button>
    <div class="market-grid" data-bind="market"></div>
  </section>
  <!-- Purchase codes and redeem them in the same layout as Hexagon Land. -->
  <div class="modal purchase-modal" data-bind="redeem-modal" aria-hidden="true">
    <form class="modal-card purchase-card" data-action="redeem-form" role="dialog" aria-modal="true" aria-labelledby="onigimon-redeem-title">
      <button class="purchase-close" type="button" data-action="close-redeem" data-i18n-alabel="close" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
      <div class="purchase-identity">
        <img data-bind="redeem-icon" alt="">
        <div><h2 id="onigimon-redeem-title" data-bind="redeem-title">Redeem Onigimon code</h2><p data-bind="redeem-hint"></p></div>
      </div>
      <div class="purchase-panel">
        <div><strong data-i18n-text="moreCodes">Want to get more coins?</strong><p data-i18n-text="supportCodes">Every coin purchase supports development so this project stays free for everyone.</p></div>
        <button class="purchase-code-btn" type="button" data-action="open-store" data-i18n-text="buyCodes">Buy Coin Codes</button>
      </div>
      <div class="purchase-divider"><span data-i18n-text="alreadyHaveCode">Already have a code?</span></div>
      <input class="purchase-input" data-bind="redeem-code" autocomplete="off" placeholder="Paste code here" data-i18n-placeholder="pasteCode" data-i18n-alabel="redeemTitle" aria-label="Onigimon reward code">
      <button class="redeem-submit purchase-submit" type="submit">Redeem</button>
    </form>
  </div>
  <div class="modal" data-bind="gift-modal" aria-hidden="true"><div class="modal-card gift-card"><button class="close-btn" type="button" data-action="close-gift" data-i18n-alabel="close" aria-label="Close">×</button><p class="eyebrow" data-bind="gift-eyebrow">ITEM ACQUIRED</p><div class="gift-item-display"><img data-bind="gift-icon" alt=""></div><h2 data-bind="gift-title">Item acquired!</h2><p class="gift-text" data-bind="gift-text"></p><p class="gift-feeling" data-bind="gift-feeling"></p><button class="redeem-submit" data-action="close-gift" data-i18n-text="okay">Okay</button></div></div>
  <div class="toast" role="status" aria-live="polite"></div>
</main>
