# Pytest configuration lives here (not in the root pyproject.toml) on
# purpose: the repository root doubles as the add-on package and its
# __init__.py requires a running Anki instance. Keeping the pytest
# rootdir anchored at tests/ prevents pytest from collecting/importing
# any package above this directory.
#
# Invoke from the repo root as:  pytest tests

[pytest]
addopts = -ra --import-mode=importlib
testpaths = .
markers =
    visual: Playwright-based visual regression tests
    qt: offscreen PyQt6 widget tests
