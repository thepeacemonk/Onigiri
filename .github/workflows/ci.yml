name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install system libraries for headless PyQt6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff baseline gate)
        run: ruff check .

      - name: Test suite (headless, no Anki)
        run: pytest tests -v

      # Dev-build artifact: everything tracked by git except paths
      # marked export-ignore in .gitattributes (tests, tools, CI).
      - name: Package add-on zip
        run: git archive --format=zip --output=Onigiri-dev-build.zip HEAD

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Onigiri-dev-build
          path: Onigiri-dev-build.zip
          retention-days: 14
